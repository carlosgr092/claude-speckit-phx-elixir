# Git Branching Workflow configuration for the /spx: lifecycle
# Copied to .specify/extensions/git/git-config.yml on install.

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[spx] Initial commit"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[spx] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[spx] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[spx] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[spx] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[spx] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[spx] Save progress before analysis"
  before_converge:
    enabled: false
    message: "[spx] Save progress before converge"
  before_taskstoissues:
    enabled: false
    message: "[spx] Save progress before issue sync"
  after_constitution:
    enabled: false
    message: "[spx] Add project constitution"
  after_specify:
    enabled: false
    message: "[spx] Add specification"
  after_clarify:
    enabled: false
    message: "[spx] Clarify specification"
  after_plan:
    enabled: false
    message: "[spx] Add implementation plan"
  after_tasks:
    enabled: false
    message: "[spx] Add tasks"
  after_implement:
    enabled: false
    message: "[spx] Implementation progress"
  after_checklist:
    enabled: false
    message: "[spx] Add checklist"
  after_analyze:
    enabled: false
    message: "[spx] Add analysis report"
  after_converge:
    enabled: false
    message: "[spx] Add converge results"
  after_taskstoissues:
    enabled: false
    message: "[spx] Sync tasks to issues"
